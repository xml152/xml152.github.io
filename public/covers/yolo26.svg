<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="YOLO26 目标检测封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a10" />
      <stop offset="55%" stop-color="#0a141c" />
      <stop offset="100%" stop-color="#071019" />
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".32" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#a3e635" stop-opacity=".18" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#c9f7ff" />
      <stop offset="100%" stop-color="#7dd3c7" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity=".07" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060a10" stop-opacity="0" />
      <stop offset="100%" stop-color="#060a10" stop-opacity=".55" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />
  <ellipse cx="930" cy="120" rx="380" ry="280" fill="url(#glow1)" filter="url(#blur)" />
  <ellipse cx="240" cy="620" rx="360" ry="260" fill="url(#glow2)" filter="url(#blur)" />
  <rect width="1200" height="700" fill="url(#grid)" />
  <rect width="1200" height="700" fill="url(#fade)" />

  <!-- 检测框 -->
  <g fill="none" stroke="#5fd3e6" stroke-opacity=".55">
    <rect x="300" y="190" width="600" height="300" rx="8" stroke-width="1.5" stroke-dasharray="10 8" />
  </g>
  <g stroke="#5fd3e6" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M282 236V190h46" />
    <path d="M872 190h46v46" />
    <path d="M918 444v46h-46" />
    <path d="M328 490h-46v-46" />
  </g>

  <!-- 标签 -->
  <g>
    <rect x="300" y="154" width="196" height="32" rx="6" fill="#5fd3e6" />
    <text x="316" y="176" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700" fill="#04252b">hand · 0.95</text>
    <rect x="752" y="496" width="148" height="30" rx="6" fill="#0e1b22" stroke="#a3e635" stroke-opacity=".45" />
    <text x="766" y="516" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#b7e86a">INT8 · 2.46 MB</text>
  </g>

  <!-- 主标题 -->
  <text x="600" y="345" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="104" font-weight="700" fill="url(#title)" letter-spacing="2">YOLO26</text>
  <text x="600" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#8fa6b5" letter-spacing="4">GESTURE DETECTION · 10 CLASSES · 640</text>

  <g stroke="#5fd3e6" stroke-opacity=".22" stroke-width="1">
    <path d="M80 120h180" />
    <path d="M940 590h180" />
  </g>
  <g fill="#5fd3e6" opacity=".5">
    <circle cx="80" cy="120" r="3" />
    <circle cx="1120" cy="590" r="3" />
  </g>

  <text x="600" y="562" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#5f7183" letter-spacing="3">TRAIN · EXPORT · QUANTIZE</text>
</svg>
