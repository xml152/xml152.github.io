<?xml version="1.0" encoding="UTF-8"?>
<!--
  《Windows 下用 VS Code 开发 C/C++：MinGW-w64 环境搭建》封面源文件（极简版）
  渲染：rsvg-convert -w 1680 -h 720 public/covers/mingw-vscode.svg -o public/covers/mingw-vscode.png
  配色取自站点 tokens.css：accent #5fd3e6 / violet #a99bff / bg #0b0f14
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720"
     role="img" aria-label="C/C++ 标志：Windows 下用 VS Code 开发 C/C++">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1720"/>
      <stop offset="0.55" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glowTeal">
      <stop offset="0" stop-color="#0a7e8f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0a7e8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#6a5ae8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6a5ae8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd3e6"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1680" height="720" fill="url(#bg)"/>
  <circle cx="240" cy="100" r="520" fill="url(#glowTeal)"/>
  <circle cx="1460" cy="660" r="520" fill="url(#glowViolet)"/>
  <rect x="0" y="0" width="1680" height="6" fill="url(#accent)"/>

  <!-- C/C++ 圆形徽章 -->
  <circle cx="840" cy="316" r="206" fill="none" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="840" cy="316" r="190" fill="#121a22" stroke="url(#accent)" stroke-width="6"/>
  <circle cx="840" cy="316" r="172" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <text x="840" y="354" text-anchor="middle" font-family="Maple Mono CN" font-size="106"
        font-weight="bold" fill="#f2f6f8" letter-spacing="-2">C/C++</text>

  <!-- 标题 -->
  <rect x="780" y="546" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="840" y="612" text-anchor="middle" font-family="Microsoft YaHei" font-size="36"
        font-weight="bold" fill="#f2f6f8">Windows 下用 VS Code 开发 C/C++</text>
  <text x="840" y="658" text-anchor="middle" font-family="Maple Mono CN" font-size="20"
        letter-spacing="1" fill="#6b7d8c">MinGW-w64 · 环境搭建</text>
</svg>
