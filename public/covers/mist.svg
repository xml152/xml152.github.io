<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="abstract cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2fdfb" />
      <stop offset="55%" stop-color="#eef7ff" />
      <stop offset="100%" stop-color="#f4f2ff" />
    </linearGradient>
    <radialGradient id="b0"><stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5" /><stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" /></radialGradient>
    <radialGradient id="b1"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" /><stop offset="100%" stop-color="#60a5fa" stop-opacity="0" /></radialGradient>
    <radialGradient id="b2"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35" /><stop offset="100%" stop-color="#a78bfa" stop-opacity="0" /></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#0ea5e9" stroke-opacity="0.14" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2fdfb" stop-opacity="0" />
      <stop offset="100%" stop-color="#f2fdfb" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />
  <ellipse cx="260" cy="480" rx="380" ry="300" fill="url(#b0)" filter="url(#soft)" />
  <ellipse cx="820" cy="150" rx="420" ry="320" fill="url(#b1)" filter="url(#soft)" />
  <ellipse cx="1050" cy="600" rx="300" ry="260" fill="url(#b2)" filter="url(#soft)" />
  <rect width="1200" height="700" fill="url(#grid)" opacity="1" />
  <rect width="1200" height="700" fill="url(#fade)" />

  <g fill="none" stroke="#0ea5e9" stroke-opacity=".2">
    <circle cx="1040" cy="120" r="150" stroke-width="1.4" />
    <circle cx="1040" cy="120" r="228" stroke-width="1" stroke-dasharray="3 12" />
    <circle cx="140" cy="620" r="96" stroke-width="1.2" />
  </g>
  <g stroke="#0ea5e9" stroke-opacity=".22" stroke-width="1.2">
    <path d="M96 596 L150 540" />
    <path d="M96 636 L190 540" />
    <path d="M96 676 L230 540" />
  </g>
</svg>
