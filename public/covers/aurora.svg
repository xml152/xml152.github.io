<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="abstract cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="55%" stop-color="#0d1526" />
      <stop offset="100%" stop-color="#141033" />
    </linearGradient>
    <radialGradient id="b0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55" /><stop offset="100%" stop-color="#22d3ee" stop-opacity="0" /></radialGradient>
    <radialGradient id="b1"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" /><stop offset="100%" stop-color="#6366f1" stop-opacity="0" /></radialGradient>
    <radialGradient id="b2"><stop offset="0%" stop-color="#e879a9" stop-opacity="0.35" /><stop offset="100%" stop-color="#e879a9" stop-opacity="0" /></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#7dd3fc" stroke-opacity="0.09" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020" stop-opacity="0" />
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />
  <ellipse cx="250" cy="170" rx="380" ry="300" fill="url(#b0)" filter="url(#soft)" />
  <ellipse cx="900" cy="520" rx="420" ry="320" fill="url(#b1)" filter="url(#soft)" />
  <ellipse cx="700" cy="120" rx="300" ry="240" fill="url(#b2)" filter="url(#soft)" />
  <rect width="1200" height="700" fill="url(#grid)" opacity="1" />
  <rect width="1200" height="700" fill="url(#fade)" />

  <g fill="none" stroke="#7dd3fc" stroke-opacity=".14">
    <circle cx="1040" cy="120" r="150" stroke-width="1.4" />
    <circle cx="1040" cy="120" r="228" stroke-width="1" stroke-dasharray="3 12" />
    <circle cx="140" cy="620" r="96" stroke-width="1.2" />
  </g>
  <g stroke="#7dd3fc" stroke-opacity=".18" stroke-width="1.2">
    <path d="M96 596 L150 540" />
    <path d="M96 636 L190 540" />
    <path d="M96 676 L230 540" />
  </g>
</svg>
